  </defs>

  <rect x="0" y="0" width="1200" height="110" fill="url(#panel)"/>
  <rect x="0" y="0" width="1200" height="110" fill="none" stroke="#E91E8C" stroke-width="1" opacity="0.4"/>

  <!-- corner brackets -->
  <g stroke="#FF3D9A" stroke-width="3" fill="none">
    <path d="M18,10 L10,10 L10,18"/>
    <path d="M1182,10 L1190,10 L1190,18"/>
    <path d="M18,100 L10,100 L10,92"/>
